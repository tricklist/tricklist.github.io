<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tricklist</title>
<meta name="description" content="tricklist: tools and tricks for designers">
<meta property="og:title" content="tricklist">
<meta name="theme-color" content="#F8F6F1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%231E3666%22/%3E%3Ctext x=%2216%22 y=%2224%22 font-size=%2222%22 font-family=%22Arial%22 font-weight=%22700%22 fill=%22%23F8F6F1%22 text-anchor=%22middle%22%3Et%3C/text%3E%3C/svg%3E">
<style>
@font-face{font-family:Th;src:url(thmanyahsans-Bold.woff2);font-weight:700}
@font-face{font-family:Th;src:url(thmanyahsans-Medium.woff2);font-weight:500}
@font-face{font-family:IT;src:url(inter-tight-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:IT;src:url(inter-tight-latin-500-normal.woff2);font-weight:500}
:root{--paper:#F8F6F1;--ink:#1E3666;--green:#29FF02;--line:rgba(30,54,102,.12)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:Th,IT,sans-serif;color:var(--ink);background-color:var(--paper);
}
main{max-width:460px;margin:0 auto;padding:56px 20px 40px;display:flex;flex-direction:column;align-items:center}
.logo{width:170px;height:auto}
.bio{margin-top:16px;font-weight:500;font-size:16px;color:rgba(30,54,102,.75);text-align:center;line-height:1.6}
.list{width:100%;margin-top:40px;display:flex;flex-direction:column;gap:12px}
a.btn{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;text-decoration:none;color:var(--ink);transition:transform .15s,border-color .15s}
a.btn:active{transform:scale(.98)}
.ic{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--paper)}
.ic svg{width:24px;height:24px}
.tx{flex:1;min-width:0}
.t1{font-weight:700;font-size:17px;line-height:1.3}
.t2{font-weight:500;font-size:13.5px;color:rgba(30,54,102,.6);margin-top:2px}
.lat{font-family:IT;font-weight:600;direction:ltr;unicode-bidi:isolate}
.arrow{width:18px;opacity:.35;flex:none}
a.feat{border:2px solid var(--ink);padding:18px 16px}
a.feat .ic{width:58px;height:58px;background:none}
a.feat .ic svg{width:58px;height:58px;overflow:visible}
.pill{display:inline-block;background:var(--green);color:var(--ink);font-weight:700;font-size:12px;padding:2px 10px;border-radius:99px;margin-inline-start:6px;vertical-align:2px}
.sec{width:100%;margin:26px 0 2px;font-weight:700;font-size:13px;color:rgba(30,54,102,.5)}
footer{margin-top:36px;font-family:IT;font-weight:500;font-size:12px;color:rgba(30,54,102,.4);direction:ltr}

/* motion */
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes logoIn{from{opacity:0;transform:translateY(10px) scale(.92);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes ring{0%{opacity:.9;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.35,1.6)}}
@keyframes sw{0%,70%,100%{transform:none}78%{transform:translateY(-5px)}86%{transform:none}}
.logo{animation:logoIn .7s cubic-bezier(.2,.8,.2,1) both}
.bio{animation:up .6s .15s cubic-bezier(.2,.8,.2,1) both}
.list>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
.list>*:nth-child(1){animation-delay:.3s}.list>*:nth-child(2){animation-delay:.38s}.list>*:nth-child(3){animation-delay:.46s}
.list>*:nth-child(4){animation-delay:.52s}.list>*:nth-child(5){animation-delay:.58s}.list>*:nth-child(6){animation-delay:.64s}
footer{animation:up .6s .8s both}
.pill{position:relative;animation:pulse 1.6s 1.2s ease-in-out infinite}.pill::after{content:"";position:absolute;inset:0;border-radius:99px;border:2px solid var(--green);opacity:0;animation:ring 1.6s 1.2s ease-out infinite}
.tcs [id^=swatch]{animation:sw 3.2s 1.4s cubic-bezier(.3,.7,.3,1) infinite;transform-box:fill-box}
.tcs #swatch-2{animation-delay:1.5s}.tcs #swatch-3{animation-delay:1.6s}
a.btn:hover{border-color:rgba(30,54,102,.35);transform:translateY(-2px)}
a.btn:hover .arrow{transform:translateX(-4px);opacity:.7}
.arrow{transition:transform .2s,opacity .2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:900px){main{padding-top:90px}}
</style></head><body><main>
<img class="logo" src="logo.svg" alt="tricklist">
<div class="list">
<a class="btn feat" href="https://tricklist.gumroad.com/l/trickcolor"><span class="ic"><svg class="tcs" viewBox="0 0 512 512" width="58" height="58" aria-hidden="true">
  
  <path id="page" fill="#1E3666" fill-rule="evenodd" d="M414.5,147.5c-27.6,0-50-22.4-50-50V0H60C26.9,0,0,26.9,0,60v312h512v-224.5h-97.5ZM170.7,169.4h-61v4.6l21.9,6.1v59.6c0,13.6,6.3,20.3,18.7,20.3h20.3v42.2h-36c-38.6,0-57.8-20.9-57.8-62.5V83.4l54.7-14.1v64.1h39.1v36Z"/>
  <path id="fold" fill="#1E3666" d="M380.3,0l131.7,131.7h-97.5c-18.9,0-34.1-15.3-34.1-34.1V0h-.1Z"/>
  <path id="swatch-1" fill="#FF5A36" d="M0,402h155.7v110H60c-33.1,0-60-26.9-60-60v-50Z"/>
  <path id="swatch-2" fill="#FFC53D" d="M185.7,402h140.7v110h-140.7v-110Z"/>
  <path id="swatch-3" fill="#2F6BFF" d="M356.3,402h155.7v50c0,33.1-26.9,60-60,60h-95.7v-110Z"/>
</svg></span>
<span class="tx"><span class="t1">حمّل <span class="lat">TrickColor</span><span class="pill">مجانًا</span></span><span class="t2" style="display:block">دليل ألوان كامل لشعارك في ثواني</span></span>
<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<a class="btn" href="https://github.com/jmlee9762/bezier-inspector-for-illustrator"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#1E3666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19C8 9 12 5 19 5"/><circle cx="5" cy="19" r="2" fill="#1E3666"/><circle cx="19" cy="5" r="2" fill="#1E3666"/><path d="M5 19l5-11"/></svg></span>
<span class="tx"><span class="t1">إضافة <span class="lat">Bezier Inspector</span></span><span class="t2" style="display:block">شوف نقاط الشعار ومقابضه بوضوح</span></span>
<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<p class="sec">تابعنا</p>

<a class="btn" href="https://www.instagram.com/tricklist90/"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#1E3666" stroke-width="2"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="#1E3666" stroke="none"/></svg></span><span class="tx"><span class="t1 lat">Instagram</span></span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<a class="btn" href="https://www.tiktok.com/@tricklist90"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#1E3666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M13 3c.5 3 2.5 4.6 5.5 4.8"/></svg></span><span class="tx"><span class="t1 lat">TikTok</span></span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
</div>
<footer>tricklist © 2026</footer>
</main></body></html>
